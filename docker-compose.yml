# Copy this file to your server:
#
#   vpush/
#     docker-compose.yml
#     update.sh
#     data/
#       apps/<app>.toml        your app files (+ optional <app>.py rule scripts)
#       vpush.db               created automatically
#
# The container runs as UID/GID 909, so it needs to own data/ once:
#   sudo chown -R 909:909 data
#
# Then: docker compose up -d     Update later with: ./update.sh

services:
  vpush:
    image: ghcr.io/1n5an1ac/vpush-server:latest
    container_name: vpush
    restart: unless-stopped
    # user: "1001:1001"     # optional: a different UID/GID than the image's 909
    # Runtime lockdown (Docker only takes these from here, not from the image):
    read_only: true          # nothing outside /data is ever written
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Only reachable from this machine; your reverse proxy forwards /vpush/ here.
      - "127.0.0.1:8080:8080"
    environment:
      VPUSH_BASE_PATH: /vpush               # the single path your proxy forwards
      VPUSH_CONTACT: mailto:you@example.com  # push services may contact this address
      VPUSH_LOG: INFO
    volumes:
      # App files (the server writes generated secrets into them) and the database.
      - ./data:/data
